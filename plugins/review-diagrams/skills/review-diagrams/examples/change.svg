<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="title desc">
  <title id="title">Change: Worker replaces Poller (sample)</title>
  <desc id="desc">Sample change diagram with placeholder components: one picture of the head structure with the diff marked on it. The Client sends an HTTP request to the API service. The API service, changed, writes the record to the Store and now also publishes a created event to the added Worker, which reads the record from the Store over an added path. The removed Poller stays as a faded dashed ghost at its old position, with its old arrow into the Store labelled polled every 60 s. Client and Store are unchanged.</desc>
  <defs>
    <style>
      svg {
        --bg: #ffffff; --fg: #1f2328; --muted: #59636e;
        --neutral: #8c959f; --neutral-bg: #f6f8fa;
        --added: #1a7f37; --added-bg: #dafbe1;
        --changed: #0969da; --changed-bg: #ddf4ff;
        --removed: #cf222e; --removed-bg: #ffebe9;
      }
      @media (prefers-color-scheme: dark) {
        svg {
          --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1;
          --neutral: #656c76; --neutral-bg: #151b23;
          --added: #3fb950; --added-bg: #0f2a1a;
          --changed: #4493f8; --changed-bg: #0c2441;
          --removed: #f85149; --removed-bg: #3a1416;
        }
      }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: var(--fg); }
      .bg { fill: var(--bg); }
      .title { font-size: 18px; font-weight: 600; }
      .name { font-weight: 600; }
      .note { font-size: 12px; fill: var(--muted); }
      .label { font-size: 12px; }
      .tag { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; }
      .neutral { fill: var(--neutral-bg); stroke: var(--neutral); stroke-width: 1.5; }
      .added { fill: var(--added-bg); stroke: var(--added); stroke-width: 3; }
      .changed { fill: var(--changed-bg); stroke: var(--changed); stroke-width: 2; }
      .removed { fill: var(--removed-bg); stroke: var(--removed); stroke-width: 1.5; stroke-dasharray: 8 4; }
      .ghost { opacity: 0.65; }
      .t-neutral { fill: var(--muted); }
      .t-added { fill: var(--added); }
      .t-changed { fill: var(--changed); }
      .t-removed { fill: var(--removed); }
      .flow { fill: none; stroke: var(--fg); stroke-width: 1.5; marker-end: url(#arrow); }
      .flow-added { fill: none; stroke: var(--added); stroke-width: 3; marker-end: url(#arrow-added); }
      .flow-removed { fill: none; stroke: var(--removed); stroke-width: 1.5; stroke-dasharray: 6 4; marker-end: url(#arrow-removed); }
      .head { fill: var(--fg); }
      .head-added { fill: var(--added); }
      .head-removed { fill: var(--removed); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="arrow-added" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path class="head-added" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="arrow-removed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head-removed" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="480"/>

  <text class="title" x="24" y="38">Change: Worker replaces Poller</text>
  <text class="note" x="24" y="60">PR number · head structure with the diff marked on it · placeholder components: draw only what the diff shows</text>

  <!-- Unchanged: Client -->
  <rect class="neutral" x="32" y="110" width="190" height="70" rx="6"/>
  <text class="tag t-neutral" x="48" y="132">UNCHANGED</text>
  <text class="name" x="48" y="151">Client</text>
  <text class="note" x="48" y="168">browser app</text>

  <!-- Changed: API service -->
  <rect class="changed" x="362" y="110" width="236" height="70" rx="6"/>
  <text class="tag t-changed" x="378" y="132">CHANGED</text>
  <text class="name" x="378" y="151">API service</text>
  <text class="note" x="378" y="168">now also publishes events</text>

  <!-- Added: Worker -->
  <rect class="added" x="738" y="110" width="190" height="70" rx="6"/>
  <text class="tag t-added" x="754" y="132">ADDED</text>
  <text class="name" x="754" y="151">Worker</text>
  <text class="note" x="754" y="168">process</text>

  <!-- Unchanged: Store -->
  <rect class="neutral" x="362" y="290" width="236" height="70" rx="6"/>
  <text class="tag t-neutral" x="378" y="312">UNCHANGED</text>
  <text class="name" x="378" y="331">Store</text>
  <text class="note" x="378" y="348">database</text>

  <!-- Removed: Poller, ghost at its old position -->
  <g class="ghost">
    <rect class="removed" x="32" y="290" width="190" height="70" rx="6"/>
    <text class="tag t-removed" x="48" y="312">REMOVED</text>
    <text class="name" x="48" y="331">Poller</text>
    <text class="note" x="48" y="348">cron job</text>
    <line class="flow-removed" x1="222" y1="325" x2="362" y2="325"/>
    <text class="label t-removed" text-anchor="middle" x="292" y="300"><tspan x="292" font-weight="600">REMOVED</tspan><tspan x="292" dy="15">polled every 60 s</tspan></text>
  </g>

  <!-- Unchanged flows -->
  <line class="flow" x1="222" y1="145" x2="362" y2="145"/>
  <text class="label" text-anchor="middle" x="292" y="136">HTTP request</text>

  <line class="flow" x1="480" y1="180" x2="480" y2="290"/>
  <text class="label" x="492" y="239">writes record</text>

  <!-- Added path: API service → Worker → Store -->
  <line class="flow-added" x1="598" y1="145" x2="738" y2="145"/>
  <text class="label t-added" text-anchor="middle" x="668" y="120"><tspan x="668" font-weight="600">ADDED</tspan><tspan x="668" dy="15">created event</tspan></text>

  <path class="flow-added" d="M833,180 V325 H598"/>
  <text class="label t-added" text-anchor="middle" x="715" y="300"><tspan x="715" font-weight="600">ADDED</tspan><tspan x="715" dy="15">reads record</tspan></text>

  <!-- Legend -->
  <rect class="added" x="32" y="407" width="28" height="16" rx="3"/>
  <text class="label" x="70" y="419">ADDED · thick solid</text>
  <rect class="changed" x="264" y="407" width="28" height="16" rx="3"/>
  <text class="label" x="302" y="419">CHANGED · solid</text>
  <rect class="removed ghost" x="496" y="407" width="28" height="16" rx="3"/>
  <text class="label" x="534" y="419">REMOVED · faded dashed ghost</text>
  <rect class="neutral" x="752" y="407" width="28" height="16" rx="3"/>
  <text class="label" x="790" y="419">UNCHANGED · grey</text>

  <line class="flow" x1="32" y1="451" x2="58" y2="451"/>
  <text class="label" x="70" y="455">arrow, labelled with what crosses it</text>
  <text class="note" x="496" y="455">each state is named in text; colour only repeats it</text>
</svg>
