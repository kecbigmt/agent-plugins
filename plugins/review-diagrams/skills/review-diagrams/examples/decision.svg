<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 588" width="960" height="588" role="img" aria-labelledby="title desc">
  <title id="title">Decision: Component A takes the responsibility (sample)</title>
  <desc id="desc">Sample decision diagram with placeholder content. Chosen option: a Caller sends a request across the boundary owned by Component A; Component A writes a record to the Store and reads it back. Not chosen: Alternative B is rejected for the reason the ADR gives, Follow-up C is deferred until the trigger the ADR names, and Earlier decision D is superseded by Component A.</desc>
  <defs>
    <style>
      svg {
        --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --line: #d0d7de;
        --neutral: #8c959f; --neutral-bg: #f6f8fa;
        --chosen: #1a7f37; --chosen-bg: #dafbe1;
        --rejected: #cf222e; --rejected-bg: #ffebe9;
        --deferred: #9a6700; --deferred-bg: #fff8c5;
        --superseded: #59636e; --superseded-bg: #eaeef2;
      }
      @media (prefers-color-scheme: dark) {
        svg {
          --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --line: #3d444d;
          --neutral: #656c76; --neutral-bg: #151b23;
          --chosen: #3fb950; --chosen-bg: #0f2a1a;
          --rejected: #f85149; --rejected-bg: #3a1416;
          --deferred: #d29922; --deferred-bg: #2e2208;
          --superseded: #9198a1; --superseded-bg: #212830;
        }
      }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: var(--fg); }
      .bg { fill: var(--bg); }
      .title { font-size: 18px; font-weight: 600; }
      .heading { font-size: 14px; font-weight: 600; }
      .name { font-weight: 600; }
      .note { font-size: 12px; fill: var(--muted); }
      .label { font-size: 12px; }
      .tag { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; }
      .panel { fill: none; stroke: var(--line); }
      .boundary { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 4; }
      .neutral { fill: var(--neutral-bg); stroke: var(--neutral); stroke-width: 1.5; }
      .chosen { fill: var(--chosen-bg); stroke: var(--chosen); stroke-width: 3; }
      .rejected { fill: var(--rejected-bg); stroke: var(--rejected); stroke-width: 1.5; stroke-dasharray: 8 4; }
      .deferred { fill: var(--deferred-bg); stroke: var(--deferred); stroke-width: 1.5; stroke-dasharray: 2 3; }
      .superseded { fill: var(--superseded-bg); stroke: var(--superseded); stroke-width: 1.5; stroke-dasharray: 12 3 2 3; }
      .t-chosen { fill: var(--chosen); }
      .t-rejected { fill: var(--rejected); }
      .t-deferred { fill: var(--deferred); }
      .t-superseded { fill: var(--superseded); }
      .flow { fill: none; stroke: var(--fg); stroke-width: 1.5; marker-end: url(#arrow); }
      .head { fill: var(--fg); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="588"/>

  <text class="title" x="24" y="38">Decision: Component A takes the responsibility</text>
  <text class="note" x="24" y="60">ADR name · placeholder labels: keep only parts the ADR states, one fact per line</text>

  <!-- Chosen option: boundary and labelled data flow -->
  <rect class="panel" x="16" y="80" width="928" height="236" rx="8"/>
  <text class="heading" x="32" y="106">Chosen option · boundary and data flow</text>

  <rect class="neutral" x="40" y="170" width="180" height="72" rx="6"/>
  <text class="name" x="56" y="201">Caller</text>
  <text class="note" x="56" y="221">starts the flow</text>

  <rect class="boundary" x="300" y="124" width="370" height="172" rx="8"/>
  <text class="note" x="316" y="148">boundary · owned by Component A</text>

  <rect class="chosen" x="330" y="170" width="300" height="72" rx="6"/>
  <text class="tag t-chosen" x="346" y="192">CHOSEN</text>
  <text class="name" x="346" y="211">Component A</text>
  <text class="note" x="346" y="229">the responsibility the ADR assigns to it</text>

  <rect class="neutral" x="740" y="170" width="180" height="72" rx="6"/>
  <text class="name" x="756" y="201">Store</text>
  <text class="note" x="756" y="221">where the state lives</text>

  <line class="flow" x1="220" y1="192" x2="328" y2="192"/>
  <text class="label" x="260" y="184" text-anchor="middle">request</text>
  <line class="flow" x1="632" y1="190" x2="738" y2="190"/>
  <text class="label" x="705" y="182" text-anchor="middle">writes</text>
  <line class="flow" x1="740" y1="222" x2="634" y2="222"/>
  <text class="label" x="705" y="240" text-anchor="middle">reads back</text>

  <!-- Options the ADR did not choose -->
  <rect class="panel" x="16" y="336" width="928" height="160" rx="8"/>
  <text class="heading" x="32" y="362">Not chosen · only what the ADR states</text>

  <rect class="rejected" x="32" y="378" width="288" height="100" rx="6"/>
  <text class="tag t-rejected" x="48" y="400">REJECTED</text>
  <text class="name" x="48" y="422">Alternative B</text>
  <text class="note" x="48" y="444"><tspan x="48">why not: the reason the ADR gives,</tspan><tspan x="48" dy="18">in one or two short lines</tspan></text>

  <rect class="deferred" x="336" y="378" width="288" height="100" rx="6"/>
  <text class="tag t-deferred" x="352" y="400">DEFERRED</text>
  <text class="name" x="352" y="422">Follow-up C</text>
  <text class="note" x="352" y="444"><tspan x="352">later: what waits, and the trigger</tspan><tspan x="352" dy="18">the ADR names for revisiting it</tspan></text>

  <rect class="superseded" x="640" y="378" width="288" height="100" rx="6"/>
  <text class="tag t-superseded" x="656" y="400">SUPERSEDED</text>
  <text class="name" x="656" y="422">Earlier decision D</text>
  <text class="note" x="656" y="444"><tspan x="656">replaced by Component A; say what</tspan><tspan x="656" dy="18">carries over and what does not</tspan></text>

  <!-- Legend -->
  <rect class="chosen" x="32" y="523" width="28" height="16" rx="3"/>
  <text class="label" x="70" y="535">CHOSEN · thick solid</text>
  <rect class="rejected" x="264" y="523" width="28" height="16" rx="3"/>
  <text class="label" x="302" y="535">REJECTED · dashed</text>
  <rect class="deferred" x="496" y="523" width="28" height="16" rx="3"/>
  <text class="label" x="534" y="535">DEFERRED · dotted</text>
  <rect class="superseded" x="728" y="523" width="28" height="16" rx="3"/>
  <text class="label" x="766" y="535">SUPERSEDED · dash-dot</text>

  <rect class="boundary" x="32" y="555" width="28" height="16" rx="3"/>
  <text class="label" x="70" y="567">responsibility boundary</text>
  <line class="flow" x1="264" y1="563" x2="290" y2="563"/>
  <text class="label" x="302" y="567">data flow, labelled with what crosses it</text>
  <text class="note" x="616" y="567">each state is named in text; colour only repeats it</text>
</svg>
